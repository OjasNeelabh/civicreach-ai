[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civicreach-ai"
version = "1.0.0"
authors = [
  { name = "Ojas Neelabh", email = "ojas@example.com" }
]
description = "Inclusive Digital Public Service & Multilingual Indian Legal Aid Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Sociology",
]

[project.scripts]
civicreach = "civicreach.cli:main"
